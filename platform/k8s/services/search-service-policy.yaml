# Per-service companion objects for search-service.
#
# Auto-generated by scripts/gen-service-companions.sh.
# Tier: T2
# App port 8090, actuator port 9100.
# PriorityClass: service-tier-2.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
---
# NetworkPolicy — search-service allows ingress only from api-gateway +
# admin-service + kubelet probes. Egress is covered by the
# platform-wide allow-services-to-* + allow-* policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: search-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 8090
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-service
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
spec:
  groups:
    - name: search-service.slo
      interval: 30s
      rules:
        - alert: search_serviceSLOErrorRateHigh
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{service="search-service",status=~"5.."}[1h]))
              /
              sum(rate(http_server_requests_seconds_count{service="search-service"}[1h]))
            ) > 0.005
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "search-service error rate > 0.5% (1h)"
            runbook: "https://wiki.trips-enjoy.com/runbooks/search-service"
        - alert: search_serviceP99LatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (route, le) (rate(http_server_requests_seconds_bucket{service="search-service"}[5m]))
            ) > 1.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "search-service p99 latency > 1s"

# Per-service companion objects for chat-service.
#
# Auto-generated by scripts/gen-service-companions.sh.
# Tier: T3
# App port 8100, actuator port 9110.
# PriorityClass: service-tier-3.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
---
# NetworkPolicy — chat-service allows ingress only from api-gateway +
# admin-service + kubelet probes. Egress is covered by the
# platform-wide allow-services-to-* + allow-* policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chat-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 8100
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-service
      ports:
        - protocol: TCP
          port: 8100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
spec:
  groups:
    - name: chat-service.slo
      interval: 30s
      rules:
        - alert: chat_serviceSLOErrorRateHigh
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{service="chat-service",status=~"5.."}[1h]))
              /
              sum(rate(http_server_requests_seconds_count{service="chat-service"}[1h]))
            ) > 0.005
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "chat-service error rate > 0.5% (1h)"
            runbook: "https://wiki.trips-enjoy.com/runbooks/chat-service"
        - alert: chat_serviceP99LatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (route, le) (rate(http_server_requests_seconds_bucket{service="chat-service"}[5m]))
            ) > 1.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "chat-service p99 latency > 1s"

# Per-service companion objects for ledger-service.
#
# Auto-generated by scripts/gen-service-companions.sh.
# Tier: T1
# App port 8099, actuator port 9109.
# PriorityClass: ledger-service-priority.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-service
  minReplicas: 6
  maxReplicas: 18
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: ledger_outbox_oldest_unpublished_seconds
        target:
          type: AverageValue
          averageValue: "5"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
---
# NetworkPolicy — ledger-service allows ingress only from api-gateway +
# admin-service + kubelet probes. Egress is covered by the
# platform-wide allow-services-to-* + allow-* policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 8099
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin-service
      ports:
        - protocol: TCP
          port: 8099
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  groups:
    - name: ledger-service.slo
      interval: 30s
      rules:
        - alert: ledger_serviceSLOErrorRateHigh
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{service="ledger-service",status=~"5.."}[1h]))
              /
              sum(rate(http_server_requests_seconds_count{service="ledger-service"}[1h]))
            ) > 0.005
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "ledger-service error rate > 0.5% (1h)"
            runbook: "https://wiki.trips-enjoy.com/runbooks/ledger-service"
        - alert: ledger_serviceP99LatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (route, le) (rate(http_server_requests_seconds_bucket{service="ledger-service"}[5m]))
            ) > 1.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "ledger-service p99 latency > 1s"
        - alert: LedgerServicePostingLagHigh
          expr: increase(ledger_posting_lag_seconds[5m]) > 10
          for: 5m
          labels:
            severity: critical
            team: finance-oncall
          annotations:
            summary: 'ledger-service posting lag > 10s'
            priority: P0
        - alert: LedgerServiceReconciliationFailed
          expr: increase(ledger_reconciliation_failures_total[1h]) > 0
          for: 5m
          labels:
            severity: critical
            team: finance-oncall
          annotations:
            summary: 'ledger-service daily reconciliation FAILED'
---
# Helm-managed migration Job. Runs DB migrations before the
# Deployment rolls. Migrate image is the service's own image; the
# entrypoint picks the migrate subcommand.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-service-migrate
  labels:
    app.kubernetes.io/name: ledger-service
    app.kubernetes.io/job: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
        app.kubernetes.io/job: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ledger-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: registry.trips-enjoy.com/ledger-service:dev-k8s
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - --spring.main.web-application-type=none
          envFrom:
            - secretRef:
                name: ledger-service-runtime
                optional: true
            - configMapRef:
                name: ledger-service-config
                optional: true
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",   memory: 1Gi  }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

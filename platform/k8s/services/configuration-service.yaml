# configuration-service — core/configuration (kotlin).
# Per docs/services/configuration-service/INTEGRATION.md — configuration component of the
# core bounded context. ClusterIP service on port 8084; Prometheus
# scrapes the actuator on port 8081.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configuration-service
---
apiVersion: v1
kind: Service
metadata:
  name: configuration-service
  labels:
    app.kubernetes.io/name: configuration-service
    app.kubernetes.io/component: configuration
    app.kubernetes.io/category: core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: configuration-service
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: actuator
      port: 8081
      targetPort: actuator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-service
  labels:
    app.kubernetes.io/name: configuration-service
    app.kubernetes.io/component: configuration
    app.kubernetes.io/category: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: configuration-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configuration-service
        app.kubernetes.io/component: configuration
        app.kubernetes.io/category: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: configuration-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: configuration-service
          image: registry.trips-enjoy.com/configuration-service:dev-k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: actuator
              containerPort: 8081
          envFrom:
            - secretRef:
                name: trips-enjoy-runtime
                optional: true
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: IDENTITY_DB_URL
              value: "jdbc:postgresql://postgres:5432/trips_enjoy?currentSchema=configuration"
            - name: IDENTITY_DB_USERNAME
              value: "postgres"
            - name: IDENTITY_DB_PASSWORD
              value: "postgres"
            - name: IDENTITY_REDIS_HOST
              value: "redis"
            - name: IDENTITY_REDIS_PORT
              value: "6379"
            - name: IDENTITY_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: IDENTITY_KEYCLOAK_BASE_URL
              value: "http://keycloak:8080"
            - name: IDENTITY_KEYCLOAK_ISSUER_URI
              value: "http://keycloak:8080/realms/platform-dev"
            - name: IDENTITY_KEYCLOAK_JWKS_URI
              value: "http://keycloak:8080/realms/platform-dev/protocol/openid-connect/certs"
            - name: IDENTITY_KEYCLOAK_ADMIN_USERNAME
              value: "admin"
            - name: IDENTITY_KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: IDENTITY_KEYCLOAK_TOPOLOGY
              value: "single-realm"
            - name: IDENTITY_KEYCLOAK_DEV_REALM_NAME
              value: "platform-dev"
            - name: SERVER_PORT
              value: "8084"
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: actuator }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: actuator }
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: actuator }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60  # up to 10 min for the seeder + warmup

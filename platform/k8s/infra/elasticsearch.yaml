# Platform infra: Elasticsearch 8.x (single-node dev mode).
#
# Per docs/shared/CONDUCTOR_WORKFLOWS.md §1 the workflow engine uses
# Elasticsearch as its index backend (workflow visibility, search, async
# system tasks). The dev reference tree ships a single-node ES with
# `discovery.type=single-node` and security disabled. Stg/prod overlays
# replace with a 3-node ES cluster + TLS + Infinispan-style index caching.
#
# ES requires `vm.max_map_count >= 262144` on the host kernel. On docker-desktop
# the operator runs `docker desktop --vm.max-map-count=262144` (Preferences →
# Docker Engine → userland proxy → kubelet args). On Linux, set
# `/proc/sys/vm/max_map_count` once on each node.
#
# Note: ES 8 dropped the `elasticsearch.yml` mapping types and uses `_doc` only.
# `xpack.security.enabled=false` is acceptable for the dev reference tree; stg/prod
# overlays enable xpack.security + basic auth + TLS.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search-index
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  labels:
    app.kubernetes.io/name: elasticsearch
data:
  elasticsearch.yml: |
    cluster.name: trips-enjoy-es
    node.name: ${HOSTNAME}
    discovery.type: single-node
    network.host: 0.0.0.0
    http.port: 9200
    transport.port: 9300
    # Disable security for dev. Stg/prod overlays enable xpack.security
    # + a bootstrap password.
    xpack.security.enabled: false
    xpack.security.enrollment.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
    # Bootstrap checks: in dev we set the heap and skip the max_map_count
    # check by ignoring it (single-node).
    bootstrap.memory_lock: false
    # Path layouts — the StatefulSet's PVC mounts at /usr/share/elasticsearch/data.
    path.data: /usr/share/elasticsearch/data
    path.logs: /usr/share/elasticsearch/logs
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search-index
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
    - name: transport
      port: 9300
      targetPort: transport
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search-index
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: search-index
    spec:
      serviceAccountName: elasticsearch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # elasticsearch image default
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ES refuses to start with vm.max_map_count < 262144. We can't change
        # host sysctls from inside a pod (privileged + hostPID needed), but
        # the cluster operator MUST set this on every node. The init container
        # here is a defensive check that exits 0 on success and 1 (so the pod
        # retries visibly) on failure — alerting will fire from the failed
        # startup.
        - name: sysctl-check
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              count=$(cat /proc/sys/vm/max_map_count)
              if [ "$count" -lt 262144 ]; then
                echo "vm.max_map_count=$count (< 262144). Set on each node: sysctl -w vm.max_map_count=262144" >&2
                exit 1
              fi
              echo "vm.max_map_count=$count OK"
          securityContext:
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            # JVM heap — 50% of container memory limit, capped at 4Gi per ES
            # guidance (no more than ~50% of RAM, never above 32Gi).
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: cluster.name
              value: trips-enjoy-es
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            # Disable the bootstrap.memory_lock check (single-node, no
            # security).
            - name: bootstrap.memory_lock
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "1",   memory: 2Gi  }
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: elasticsearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: elasticsearch
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Conductor pre-creates the `conductor_workflow` index on first workflow
# start, but operators may want to pre-create it so dashboards/queries
# work immediately. This Job is idempotent — it exits 0 if the index
# already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/job: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/job: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: elasticsearch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: init
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Idempotent: PUT on an existing index returns 400 + resource_already_exists
              # which we tolerate.
              http_code=$(curl -sS -o /tmp/out -w '%{http_code}' \
                -XPUT "http://elasticsearch:9200/conductor_workflow" \
                -H 'Content-Type: application/json' \
                -d '{
                  "settings": { "number_of_shards": 1, "number_of_replicas": 0 },
                  "mappings": { "dynamic": "true" }
                }')
              if [ "$http_code" = "200" ] || [ "$http_code" = "400" ]; then
                echo "conductor_workflow index ready (HTTP $http_code)"
                cat /tmp/out || true
                exit 0
              fi
              echo "unexpected HTTP $http_code" >&2
              cat /tmp/out >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch

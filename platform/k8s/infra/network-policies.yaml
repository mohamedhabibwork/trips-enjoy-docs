  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: ["trips-enjoy"]
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["observability"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
# Allow observability stack → every infra component for scraping + health.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-to-infra
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: observability
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 9121   # postgres-exporter (added by stg/prod overlay; dev has no exporter, harmless)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 9121
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: event-bus
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9999   # kafka JMX
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: iam
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: workflow-engine
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: object-store
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: search-index
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080   # service app ports
          endPort: 8101
        - protocol: TCP
          port: 9090   # service actuator ports
          endPort: 9111
---
# Conductor → elasticsearch egress (index backend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-conductor-to-elasticsearch
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workflow-engine

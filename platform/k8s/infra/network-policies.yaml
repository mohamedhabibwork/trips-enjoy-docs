    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300
---
# file-service + audit-service + reporting-service + configuration-service →
# minio egress (object storage).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-object-storage-clients-to-minio
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: ["trips-enjoy"]
      - key: app.kubernetes.io/name
        operator: In
        values: ["file-service","audit-service","reporting-service","configuration-service"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
---
# Conductor bridge → kafka + conductor egress (signal translation).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-conductor-bridge-egress
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:

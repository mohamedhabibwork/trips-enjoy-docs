---
# Allow every service → conductor egress (workflow task polling).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-conductor
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: ["trips-enjoy"]
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["database","cache","event-bus","iam","workflow-engine","workflow-engine-ui","workflow-engine-bridge","object-store","search-index","observability","exporter"]
  policyTypes:

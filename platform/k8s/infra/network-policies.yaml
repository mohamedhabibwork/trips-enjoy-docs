---
# Allow every service → postgres egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: ["trips-enjoy"]
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["database","cache","event-bus","iam","workflow-engine","workflow-engine-ui","workflow-engine-bridge","object-store","search-index","observability","exporter"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Allow every service → redis egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-redis
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: ["trips-enjoy"]
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["database","cache","event-bus","iam","workflow-engine","workflow-engine-ui","workflow-engine-bridge","object-store","search-index","observability","exporter"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
---

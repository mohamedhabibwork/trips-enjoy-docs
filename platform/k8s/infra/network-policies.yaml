# Platform infra: NetworkPolicies (default-deny + explicit allow matrix).
#
# Per docs/architecture/SECURITY_ARCHITECTURE.md §17 + ADR-0012 the
# platform uses default-deny ingress + egress with explicit allow pairs.
# This file is the **platform-wide** default-deny + the cross-cutting
# allow rules that aren't service-specific:
#
#   - default-deny ingress + egress in the namespace (every pod)
#   - DNS egress to kube-system/CoreDNS (UDP + TCP 53)
#   - api-gateway → every service (ClusterIP, port app)
#   - admin-service → every service
#   - observability stack (prometheus, alertmanager, grafana, loki,
#     otel-collector) → every service
#   - every service → postgres (5432)
#   - every service → redis (6379)
#   - every service → kafka (9092)
#   - identity-service → keycloak (8080)
#   - every service → keycloak (8080, JWKS-only validation)
#   - every service → conductor (8080)
#   - file-service → minio (9000)
#   - audit-service → minio (9000)
#   - reporting-service → minio (9000)
#   - configuration-service → minio (9000)
#   - conductor → elasticsearch (9200)
#   - every service → otel-collector (4317, 4318)
#   - kube-system → every service (kubelet + kube-proxy)
#
# Per-service NetworkPolicies (the "service can be reached by X, can talk
# to Y" matrix) live in infra/services/<name>-policy.yaml and patch the
# per-service labels onto the selector side.
---
# Default-deny ingress + egress for every pod in the namespace.
# Operators override per-pod with a more permissive NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS egress to kube-system/CoreDNS. Without this every pod's
# ServiceAccount-token mount + cluster API calls fail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow the kubelet + kube-proxy + node-IP ranges to reach every pod
# for health probes. Kubelet probes originate from the node's IP, which
# the cluster-network CIDR (10.244.0.0/16 by default for Calico /
# Flannel / Cilium) falls inside. Operators adjust this CIDR per
# cluster; the dev tree uses the docker-desktop default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.244.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8091
        - protocol: TCP
          port: 8092
        - protocol: TCP
          port: 8093
        - protocol: TCP
          port: 8094
        - protocol: TCP
          port: 8095
        - protocol: TCP
          port: 8096
        - protocol: TCP
          port: 8097
        - protocol: TCP
          port: 8098
        - protocol: TCP
          port: 8099
        - protocol: TCP
          port: 8100
        - protocol: TCP
          port: 8101
        # Actuator ports (9090-9111) — the platform convention.
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095
        - protocol: TCP
          port: 9096
        - protocol: TCP
          port: 9097
        - protocol: TCP
          port: 9098
        - protocol: TCP
          port: 9099
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
        - protocol: TCP
          port: 9104
        - protocol: TCP
          port: 9105
        - protocol: TCP
          port: 9106
        - protocol: TCP
          port: 9107
        - protocol: TCP
          port: 9108
        - protocol: TCP
          port: 9109
        - protocol: TCP
          port: 9110
        - protocol: TCP
          port: 9111
---
# Allow api-gateway → every service ingress. api-gateway is the only
# ingress for end-user traffic; it terminates TLS at the cluster edge
# and translates JWT → headers (ADR-0019).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-ingress
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 8080
---
# Allow admin-service → every service ingress for support / operator flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-service-ingress
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:

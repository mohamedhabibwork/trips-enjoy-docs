# Platform infra: Loki 3.x (monolithic mode, single instance).
#
# Per docs/architecture/OBSERVABILITY.md + docs/shared/OSS_DEPENDENCIES.md
# §2 the log backend is Loki. The dev reference tree ships a single
# monolithic Loki (everything in one process) backed by filesystem
# storage. Stg/prod overlays swap to a 3-node distributed Loki with
# chunk storage in S3/MinIO.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
data:
  loki.yaml: |
    # Loki 3.x monolithic config. Dev tree uses the same process for
    # ingester + querier + index gateway + compactor.
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # Retain 7d in dev to bound disk usage.
      retention_period: 168h
      # Per-stream rate limit (defense against a misbehaving service
      # flooding the log backend).
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_entries_limit_per_query: 5000
      max_query_series: 500
    # ruler / query_range / frontend config: dev defaults.
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      alertmanager_url: http://alertmanager:9093
    frontend:
      max_outstanding_per_tenant: 2048
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
    - name: grpc
      port: 9096
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: loki
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          args:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env=true
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1",   memory: 1Gi  }
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: loki-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: loki
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki

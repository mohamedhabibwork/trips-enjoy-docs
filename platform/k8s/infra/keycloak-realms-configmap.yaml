# Platform infra: Keycloak realm imports.
#
# Per docs/architecture/KEYCLOAK_ARCHITECTURE.md the canonical topology is
# 6 realms: `platform-customer`, `platform-driver`, `platform-courier`,
# `platform-staff`, `platform-internal`, `platform-services`. In dev
# (`IDENTITY_KEYCLOAK_TOPOLOGY=single-realm`) these collapse into one
# `platform-dev` realm.
#
# The identity-service seeder (apps/identity-service/...) creates the
# canonical 130 roles + 37 clients + 63 protocol mappers + 8 users via
# REST on first boot. The realms defined here are the **skeletal** realms
# the seeder expects to find when it boots — they are imported on first
# Keycloak start (the `start --import-realm` flag is idempotent: if the
# realm already exists, the import is skipped).
#
# In dev: only `platform-dev.json` is imported (single-realm topology).
# In stg/prod: all 6 realm files are imported (multi-realm topology).
# Stg/prod overlays add the other 5 realm JSON files to this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: iam
data:
  # Single-realm dev topology. Imported on first Keycloak start.
  # The actual realm JSON is generated by `kc.sh export` against a
  # reference instance. For the dev reference tree this is a placeholder
  # that identity-service's `KeycloakSeeder.kt` overwrites on first boot.
  # Operators who want to skip the seeder run set
  # `IDENTITY_KEYCLOAK_SEED_ENABLED=false` and import a real realm here.
  platform-dev.json: |
    {
      "realm": "platform-dev",
      "enabled": true,
      "accessTokenLifespan": 1800,
      "accessTokenLifespanForImplicitFlow": 1800,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "registrationAllowed": false,
      "rememberMe": false,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "roles": {
        "realm": [
          { "name": "platform.admin" },
          { "name": "platform.support" },
          { "name": "platform.engineer" },
          { "name": "platform.security" }
        ]
      },
      "clients": [
        {
          "clientId": "platform-services",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": false,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "redirectUris": ["http://api-gateway:8080/*"],
          "webOrigins": ["*"],
          "protocol": "openid-connect"
        },
        {
          "clientId": "super-admin-cli",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect"
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            { "type": "password", "value": "admin", "temporary": false }
          ],
          "realmRoles": ["platform.admin", "platform.security"]
        }
      ]
    }

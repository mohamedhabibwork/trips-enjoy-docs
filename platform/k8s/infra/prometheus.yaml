# Platform infra: Prometheus v3 (hand-rolled, kube-prometheus-stack-compatible).
#
# Per docs/architecture/OBSERVABILITY.md + ADR-0011 + ADR-0012 the
# canonical scrape + alert + record stack is kube-prometheus-stack. The
# dev reference tree ships a hand-rolled Prometheus (so docker-desktop
# doesn't need the kube-prometheus-stack CRDs to be installed), but the
# scrape config + recording/alerting rule format is 100% compatible
# with the kube-prometheus-stack Helm chart so stg/prod overlays can
# swap to that chart without rewriting rules.
#
# Scrape model (ADR-0011 + ADR-0019):
#   - Kubernetes pod SD with relabel on `prometheus.io/scrape=true`
#   - ServiceMonitor CRDs (in infra/servicemonitors/*.yaml) declare the
#     same scrape target list; both work in the dev tree (ServiceMonitor
#     is matched by label, prometheus.yml is the fallback).
#   - 15s scrape interval, 15s evaluation interval
#   - 15d retention (Prometheus 3.x default; --storage.tsdb.retention.time)
#   - 20Gi PVC for TSDB
#
# Rules: infra/prometheus-rules.yaml mounts the platform-wide recording
# and alerting rules. Per-service rules live in
# infra/services/<name>-prometheusrule.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        platform: trips-enjoy
        # cluster + region are populated from the secret at boot by the
        # init container (see infra/prometheus-init).
        cluster: trips-enjoy-dev
        region: local
    # Storage: 15-day retention, 20Gi PVC (configured via flags below).
    # Recording + alerting rule files mounted via the rule sidecar.
    rule_files:
      - /etc/prometheus/rules/*.yaml
    # Alertmanager endpoint (same namespace).
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    scrape_configs:
      # Kubernetes service discovery: every pod with `prometheus.io/scrape=true`
      # gets scraped at `prometheus.io/path` on `prometheus.io/port`.
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: keep
            regex: \d+
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app_kubernetes_io_name
      # ServiceMonitor / PodMonitor discovery via file SD — the
      # kube-prometheus-stack convention. Operators who switch to the
      # Helm chart keep the same files.
      - job_name: 'service-monitors'
        file_sd_configs:
          - files:
              - /etc/prometheus/servicemonitors/*.json
      # Infra exporters (redis-exporter, postgres-exporter, kafka-exporter)
      # discovered by Service label.
      - job_name: 'infrastructure'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
            regex: exporter
            action: keep
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_service_port_name]
            action: replace
            regex: ([^:]+);([^:]+);([^:]+)
            replacement: $1.$2.svc.cluster.local:$3
            target_label: __address__
---
# Platform-wide recording + alerting rules. Per-service rules live in
# infra/services/<name>-prometheusrule.yaml; this file is for cross-cutting
# signals (SLO burn rates, outbox lag thresholds, partition health).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
data:
  platform-slo.yaml: |
    # Cross-cutting recording + alerting rules.
    # Per docs/architecture/OBSERVABILITY.md "Service-Level Objectives"
    # + ADR-0009 (transactional outbox lag) + DATABASE_ARCHITECTURE.md
    # §7 (partition health).
    groups:
      - name: platform.slo
        interval: 30s
        rules:
          # Request-duration p99 by service + route (Micrometer histogram).
          - record: http_request_duration_seconds:p99
            expr: |
              histogram_quantile(0.99,
                sum by (service, route, le) (
                  rate(http_server_requests_seconds_bucket{}[5m])
                )
              )
          - record: http_request_duration_seconds:p95
            expr: |
              histogram_quantile(0.95,
                sum by (service, route, le) (
                  rate(http_server_requests_seconds_bucket{}[5m])
                )
              )
          # Error ratio by service.
          - record: http_requests_error_ratio:5m
            expr: |
              sum by (service) (rate(http_server_requests_seconds_count{status=~"5..",code!~"5.."}[5m]))
              /
              sum by (service) (rate(http_server_requests_seconds_count[5m]))
      - name: platform.outbox
        interval: 30s
        rules:
          # Per-service outbox lag (publishers emit `outbox_oldest_unpublished_seconds`
          # gauge + `outbox_published_total` counter).
          - alert: PlatformOutboxLagHigh
            expr: max by (service) (outbox_oldest_unpublished_seconds) > 5
            for: 2m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Outbox lag > 5s for {{ $labels.service }}"
              description: "{{ $labels.service }} outbox lag is {{ $value }}s; expected < 5s p99."
              runbook: "https://wiki.trips-enjoy.com/runbooks/outbox-lag"
          - alert: PlatformOutboxLagCritical
            expr: max by (service) (outbox_oldest_unpublished_seconds) > 30
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Outbox lag > 30s for {{ $labels.service }} (events not being published)"
      - name: platform.kafka
        interval: 30s
        rules:
          - alert: PlatformKafkaConsumerLagHigh
            expr: |
              sum by (service, topic) (kafka_consumer_lag_messages) > 5000
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Kafka consumer lag > 5k for {{ $labels.service }} on {{ $labels.topic }}"
          - alert: PlatformKafkaConsumerLagCritical
            expr: |
              sum by (service, topic) (kafka_consumer_lag_messages) > 50000
            for: 10m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Kafka consumer lag > 50k for {{ $labels.service }} on {{ $labels.topic }}"
      - name: platform.partition_health
        interval: 5m
        rules:
          - alert: PostgresPartitionMissingToday
            expr: |
              absent(
                pg_partition_count{service="audit",table="audit_events",period="current_month"} == 1
              )
              or
              pg_partition_count{service="audit",table="audit_events",period="current_month"} == 0
            for: 30m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "audit.audit_events partition for the current month is missing"
              description: "PartitionMaintenanceJob failed at 02:00 UTC. Run: SELECT partman.partition_health('audit','audit_events');"
      - name: platform.pod_health
        interval: 30s
        rules:
          - alert: PlatformPodOOMKilled
            expr: |
              increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[15m]) > 0
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Pod OOMKilled: {{ $labels.pod }} in {{ $labels.namespace }}"
          - alert: PlatformPodCrashLooping
            expr: |
              increase(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[15m]) > 0
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Pod CrashLoopBackOff: {{ $labels.pod }}"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody — prometheus image default
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=18GB
            - --storage.tsdb.wal-compression
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            - --web.enable-lifecycle
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1",   memory: 1Gi  }
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: prometheus
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus

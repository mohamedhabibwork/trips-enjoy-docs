# Platform infra: Grafana with starter dashboards.
#
# Per docs/architecture/OBSERVABILITY.md Grafana is the operator-facing
# dashboards tier. The dev reference tree ships a single Grafana with
# a starter dashboard set (api-gateway requests, outbox lag, kafka
# consumer lag, redis hit ratio, postgres partition health) sourced
# from the platform's Prometheus.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
data:
  grafana.ini: |
    [server]
    http_port = 3000
    domain = localhost
    [security]
    admin_user = admin
    admin_password = admin
    [auth.anonymous]
    enabled = true
    org_role = Viewer
    [users]
    allow_sign_up = false
    [dashboards]
    default_home_dashboard_path = /etc/grafana/dashboards/api-gateway.json
  provisioning-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
  provisioning-dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'platform'
        folder: 'Platform'
        type: file
        options:
          path: /etc/grafana/dashboards
  api-gateway.json: |
    {
      "title": "API Gateway — Requests",
      "tags": ["api-gateway"],
      "timezone": "browser",
      "schemaVersion": 38,
      "panels": [
        {
          "title": "Request rate by route",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (route) (rate(http_server_requests_seconds_count{service=\"api-gateway\"}[1m]))", "legendFormat": "{{route}}" }
          ]
        },
        {
          "title": "P99 latency by route",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (route, le) (rate(http_server_requests_seconds_bucket{service=\"api-gateway\"}[5m])))", "legendFormat": "p99 {{route}}" }
          ]
        }
      ]
    }
  outbox-lag.json: |
    {
      "title": "Outbox Lag",
      "tags": ["outbox"],
      "schemaVersion": 38,
      "panels": [
        {
          "title": "Oldest unpublished (s) by service",
          "type": "timeseries",
          "targets": [
            { "expr": "outbox_oldest_unpublished_seconds", "legendFormat": "{{service}}" }
          ]
        },
        {
          "title": "Outbox published rate",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (service) (rate(outbox_published_total[1m]))", "legendFormat": "{{service}}" }
          ]
        }
      ]
    }
  kafka-consumer-lag.json: |
    {
      "title": "Kafka Consumer Lag",
      "tags": ["kafka"],
      "schemaVersion": 38,
      "panels": [
        {
          "title": "Lag (messages) by service + topic",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (service, topic) (kafka_consumer_lag_messages)", "legendFormat": "{{service}} / {{topic}}" }
          ]
        }
      ]
    }
  redis-hit-ratio.json: |
    {
      "title": "Redis Cache Hit Ratio",
      "tags": ["redis"],
      "schemaVersion": 38,
      "panels": [
        {
          "title": "Hit ratio (5m)",
          "type": "stat",
          "targets": [
            { "expr": "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))" }
          ]
        },
        {
          "title": "Memory used",
          "type": "timeseries",
          "targets": [
            { "expr": "redis_memory_used_bytes", "legendFormat": "used" }
          ]
        }
      ]
    }
  postgres-partition-health.json: |
    {
      "title": "Postgres Partition Health",
      "tags": ["postgres","partitions"],
      "schemaVersion": 38,
      "panels": [
        {
          "title": "Future partitions by service + table",
          "type": "timeseries",
          "targets": [
            { "expr": "pg_partition_count{result=\"future\"}", "legendFormat": "{{service}} / {{table}}" }
          ]
        },
        {
          "title": "Partition maintenance runs (24h)",
          "type": "stat",
          "targets": [
            { "expr": "sum by (service, table) (increase(partition_maintenance_runs_total[24h]))" }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472  # grafana image default
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: config
              mountPath: /etc/grafana
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: dashboards
          configMap:
            name: grafana-config
        - name: data
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana

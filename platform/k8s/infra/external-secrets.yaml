# Platform infra: ExternalSecrets + Vault Agent annotations.
#
# Per docs/architecture/SECURITY_ARCHITECTURE.md §5 + ADR-0012 the
# platform mounts secrets from Vault. Two delivery mechanisms are
# supported:
#
#   1. ExternalSecrets Operator (preferred for clusters without Vault
#      Agent Injector). The operator syncs Vault KV paths into
#      Kubernetes Secrets every `refreshInterval`. Each service gets
#      a `<service>-runtime` Secret. This file ships the
#      ClusterSecretStore + one ExternalSecret per service + the
#      per-service Secret targets.
#
#   2. Vault Agent Injector (alternative). Operators uncomment the
#      annotations on each service Deployment to enable the sidecar
#      pattern. See docs/architecture/SECURITY_ARCHITECTURE.md §5 for
#      the Vault Agent annotation set.
#
# Vault path convention per DEPLOYMENT_ARCHITECTURE.md
# §Per-Environment DB + Secret Path Convention:
#
#   secret/<service>/<env>/db/{url,username,password}
#   secret/<service>/<env>/redis/{host,port,password}
#   secret/<service>/<env>/kafka/bootstrap-servers
#   secret/payment-service/gateway/<gateway_id>/<env>    (46 gateways × 4 envs)
#
# The dev reference tree does NOT include the ExternalSecrets Operator
# CRDs (operators install them via Helm in stg/prod). The ExternalSecret
# objects here are inert until the CRD is installed; the
# hand-written `trips-enjoy-runtime` Secret keeps the dev tree working.
---
# ClusterSecretStore — points at the in-cluster Vault (deployed as an
# overlay; not in the dev tree). The `kubernetes` auth method uses the
# ExternalSecret's ServiceAccount for authentication.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: trips-enjoy
spec:
  provider:
    vault:
      # The dev tree ships this Vault endpoint only via stg/prod overlays.
      # Operators can also point at HashiCorp Cloud Vault by changing
      # the `server` URL.
      server: https://vault.trips-enjoy.com:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: trips-enjoy-dev
          # ServiceAccount JWT projected by ESO via the tokenReview API.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Per-service ExternalSecret templates. Each ExternalSecret mirrors
# the platform's documented Vault path layout into a `<service>-runtime`
# Kubernetes Secret that the Deployment references via `envFrom.secretRef`.
#
# The template is repeated per service. Operators who want a different
# delivery method (Vault Agent Injector sidecar) skip these entirely
# and add Vault Agent annotations to the Deployment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-gateway-runtime
  labels:
    app.kubernetes.io/part-of: trips-enjoy
    app.kubernetes.io/name: api-gateway
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: api-gateway-runtime
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: API_GATEWAY_KEYCLOAK_ISSUER_URLS
      remoteRef:
        key: secret/data/api-gateway/dev/auth
        property: issuer-urls
    - secretKey: API_GATEWAY_REDIS_PASSWORD
      remoteRef:
        key: secret/data/api-gateway/dev/redis
        property: password
    - secretKey: API_GATEWAY_KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: secret/data/api-gateway/dev/kafka
        property: bootstrap-servers
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: identity-service-runtime
  labels:
    app.kubernetes.io/part-of: trips-enjoy
    app.kubernetes.io/name: identity-service
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: identity-service-runtime
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: IDENTITY_DB_URL
      remoteRef:
        key: secret/data/identity-service/dev/db
        property: url
    - secretKey: IDENTITY_DB_USERNAME
      remoteRef:
        key: secret/data/identity-service/dev/db
        property: username
    - secretKey: IDENTITY_DB_PASSWORD
      remoteRef:
        key: secret/data/identity-service/dev/db
        property: password
    - secretKey: IDENTITY_REDIS_PASSWORD
      remoteRef:
        key: secret/data/identity-service/dev/redis
        property: password
    - secretKey: IDENTITY_KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: secret/data/identity-service/dev/kafka
        property: bootstrap-servers
    - secretKey: IDENTITY_KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: secret/data/identity-service/dev/keycloak
        property: admin-password
    - secretKey: IDENTITY_KEYCLOAK_ADMIN_CLIENT_SECRET
      remoteRef:
        key: secret/data/identity-service/dev/keycloak
        property: admin-client-secret
---

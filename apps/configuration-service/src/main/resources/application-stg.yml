spring:
  datasource:
    url: ${CONFIGURATION_SERVICE_DB_URL}
    username: ${CONFIGURATION_SERVICE_DB_USERNAME}
    password: ${CONFIGURATION_SERVICE_DB_PASSWORD}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS configuration;'
  data:
    redis:
      host: ${CONFIGURATION_SERVICE_REDIS_HOST}
      port: ${CONFIGURATION_SERVICE_REDIS_PORT}
      password: ${CONFIGURATION_SERVICE_REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${CONFIGURATION_SERVICE_KAFKA_BOOTSTRAP_SERVERS}

configuration-service:
  keycloak:
    base-url: ${CONFIGURATION_SERVICE_KEYCLOAK_BASE_URL}
    issuer-uri: ${CONFIGURATION_SERVICE_KEYCLOAK_ISSUER_URI}
    jwks-uri: ${CONFIGURATION_SERVICE_KEYCLOAK_JWKS_URI}
    admin-realm: ${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_REALM}
    admin-client-id: ${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET}
    admin-username: ${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_USERNAME}
    admin-password: ${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_PASSWORD}

spring.application.name=configuration-service
server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${CONFIGURATION_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=configuration}
spring.datasource.username=${CONFIGURATION_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${CONFIGURATION_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=configuration
spring.flyway.schemas=configuration
spring.flyway.default-schema=configuration
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS configuration;
spring.data.redis.host=${CONFIGURATION_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${CONFIGURATION_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${CONFIGURATION_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${CONFIGURATION_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
configuration-service.keycloak.base-url=${CONFIGURATION_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
configuration-service.keycloak.issuer-uri=${CONFIGURATION_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
configuration-service.keycloak.jwks-uri=${CONFIGURATION_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
configuration-service.keycloak.admin-realm=${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_REALM:master}
configuration-service.keycloak.admin-client-id=${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
configuration-service.keycloak.admin-client-secret=${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
configuration-service.keycloak.admin-username=${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
configuration-service.keycloak.admin-password=${CONFIGURATION_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

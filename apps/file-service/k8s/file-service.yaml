---
# file-service Kubernetes manifests.
#
# Mirrors apps/identity-service/k8s/identity-service.yaml in shape so
# the platform's deployment ergonomics stay uniform (single multi-doc
# file, one ServiceAccount, Service + Deployment + HPA + PDB +
# ConfigMap + pre-upgrade migrate Job).
#
# Resource limits + replica counts come from
# docs/services/file-service/README.md §16:
#   - default replicas 6, HPA max 12
#   - requests 500m / 768Mi, limits 1 / 1.5Gi
#   - HPA: CPU 60% + custom metric files_uploads_per_second > 50
#
# Secrets come from Vault via External Secrets (per
# docs/architecture/SECURITY_ARCHITECTURE.md §Secrets); the Secret
# name `file-service-runtime` is the contract.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-runtime-config
data:
  PLATFORM_ENV: "dev"
  FILE_SERVICE_PUBLIC_PORT: "8084"
  FILE_SERVICE_ADMIN_PORT: "8081"
  FILE_SERVICE_MAX_UPLOAD_SIZE_BYTES: "104857600"
  FILE_SERVICE_SYNC_SCAN_MAX_SIZE_BYTES: "5242880"
  FILE_SERVICE_DEFAULT_SIGNED_URL_TTL_SECONDS: "900"
  FILE_SERVICE_KAFKA_TOPIC_FILE_UPLOADED: "file.file.uploaded"
  FILE_SERVICE_KAFKA_TOPIC_FILE_SCANNED: "file.file.scanned"
  FILE_SERVICE_KAFKA_TOPIC_FILE_DELETED: "file.file.deleted"
  FILE_SERVICE_KAFKA_TOPIC_FILE_MIGRATED: "file.file.migrated"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  labels:
    app.kubernetes.io/name: file-service
spec:
  selector:
    app.kubernetes.io/name: file-service
  ports:
    - name: http-public
      port: 8084
      targetPort: http-public
    - name: http-admin
      port: 8081
      targetPort: http-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: file-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: file-service
          image: registry.trips-enjoy.com/file-service:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-public
              containerPort: 8084
            - name: http-admin
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: file-service-runtime-config
            - secretRef:
                name: file-service-runtime
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: "1", memory: 1.5Gi }
          livenessProbe:
            httpGet: { path: /health, port: http-public }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http-public }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /started, port: http-public }
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 6
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
    - type: Pods
      pods:
        metric:
          name: files_uploads_per_second
        target:
          type: AverageValue
          averageValue: "50"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: file-service
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service
---
apiVersion: batch/v1
kind: Job
metadata:
  name: file-service-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: file-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: registry.trips-enjoy.com/file-service:REPLACE_WITH_SHA
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: file-service-runtime-config
            - secretRef:
                name: file-service-runtime
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
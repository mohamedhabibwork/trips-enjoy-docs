---
# notification-service Kubernetes manifests.
#
# Mirrors apps/file-service/k8s/file-service.yaml in shape so the platform's
# deployment ergonomics stay uniform: a single multi-doc file with one
# ServiceAccount, ConfigMap + External-Secret reference, Service + Deployment
# + HPA + PDB + pre-upgrade migrate Job.
#
# Resource limits + replica counts come from
# docs/services/notification-service/README.md §16:
#   - default replicas 8 (per READMEs/SRS "T2 — business core, 8 replicas")
#   - requests 500m / 768Mi, limits 1 / 1.5Gi
#   - HPA: CPU 60% + custom metric `notifications_in_flight > 2000`
#
# Secrets come from Vault via External Secrets (per
# docs/architecture/SECURITY_ARCHITECTURE.md §Secrets); the Secret name
# `notification-service-runtime` is the contract.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-runtime-config
data:
  PLATFORM_ENV: "dev"
  NOTIFICATION_SERVICE_PUBLIC_PORT: "8086"
  NOTIFICATION_SERVICE_DEDUP_WINDOW_SECONDS: "60"
  NOTIFICATION_SERVICE_WHATSAPP_APPROVAL_REQUIRED: "true"
  NOTIFICATION_SERVICE_WHATSAPP_WINDOW_24H_ENFORCED: "true"
  NOTIFICATION_SERVICE_SEED_ENABLED: "false"
  NOTIFICATION_SERVICE_OUTBOX_PUBLISH_INTERVAL_MS: "1000"
  NOTIFICATION_SERVICE_PARTITION_CRON: "0 0 2 * * *"
  NOTIFICATION_SERVICE_IDEMPOTENCY_CLEANUP_CRON: "0 0 3 * * *"
  # Kafka topics emitted by this service (INTEGRATION.md §3.1)
  NOTIFICATION_SERVICE_TOPIC_SENT: "notification.notification.sent"
  NOTIFICATION_SERVICE_TOPIC_FAILED: "notification.notification.failed"
  NOTIFICATION_SERVICE_TOPIC_SUPPRESSED: "notification.notification.suppressed"
  NOTIFICATION_SERVICE_TOPIC_DELIVERED: "notification.notification.delivered"
  NOTIFICATION_SERVICE_TOPIC_READ: "notification.notification.read"
  NOTIFICATION_SERVICE_TOPIC_PUBLISHED: "notification.notification.published"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8086
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 8
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: notification-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: notification-service
          image: registry.trips-enjoy.com/notification-service:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: notification-service-runtime-config
            - secretRef:
                name: notification-service-runtime
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: "1", memory: 1.5Gi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /started, port: http }
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 8
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
    - type: Pods
      pods:
        metric:
          name: notifications_in_flight
        target:
          type: AverageValue
          averageValue: "2000"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
---
apiVersion: batch/v1
kind: Job
metadata:
  name: notification-service-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: notification-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: registry.trips-enjoy.com/notification-service:REPLACE_WITH_SHA
          command: ["/app/notification-service"]
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: notification-service-runtime-config
            - secretRef:
                name: notification-service-runtime
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      restartPolicy: OnFailure
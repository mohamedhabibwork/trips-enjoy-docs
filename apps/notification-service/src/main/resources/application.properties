spring.application.name=notification-service
server.port=8086
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${NOTIFICATION_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=notification}
spring.datasource.username=${NOTIFICATION_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${NOTIFICATION_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notification
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS notification;
spring.data.redis.host=${NOTIFICATION_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${NOTIFICATION_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${NOTIFICATION_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${NOTIFICATION_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
notification-service.keycloak.base-url=${NOTIFICATION_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
notification-service.keycloak.issuer-uri=${NOTIFICATION_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
notification-service.keycloak.jwks-uri=${NOTIFICATION_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
notification-service.keycloak.admin-realm=${NOTIFICATION_SERVICE_KEYCLOAK_ADMIN_REALM:master}
notification-service.keycloak.admin-client-id=${NOTIFICATION_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
notification-service.keycloak.admin-client-secret=${NOTIFICATION_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
notification-service.keycloak.admin-username=${NOTIFICATION_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
notification-service.keycloak.admin-password=${NOTIFICATION_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

# ----- Seeder (matches identity-service KeycloakSeeder pattern) -----
# Disabled by default. Flip on in non-production to log the runtime config surface.
notification-service.seed.enabled=${NOTIFICATION_SERVICE_SEED_ENABLED:false}
notification-service.seed.default-locale=${NOTIFICATION_SERVICE_SEED_DEFAULT_LOCALE:en}
notification-service.seed.fallback-locale=${NOTIFICATION_SERVICE_SEED_FALLBACK_LOCALE:en}
notification-service.seed.dedup-window-seconds=${NOTIFICATION_SERVICE_SEED_DEDUP_WINDOW_SECONDS:60}
notification-service.seed.whatsapp.approval-required=${NOTIFICATION_SERVICE_SEED_WHATSAPP_APPROVAL_REQUIRED:true}
notification-service.seed.whatsapp.window-24h-enforced=${NOTIFICATION_SERVICE_SEED_WHATSAPP_WINDOW_24H_ENFORCED:true}
notification-service.seed.channel-priority=${NOTIFICATION_SERVICE_SEED_CHANNEL_PRIORITY:push,sms,email,in_app,whatsapp}

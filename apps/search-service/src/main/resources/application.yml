# Spring Boot 4 baseline for search-service. See application-{dev,stg,prod}.yml
# for environment overrides and .env.example for the env-var surface.
#
# DB model: every service shares database `trips_enjoy` and owns one schema
# `search` per docs/architecture/DATABASE_ARCHITECTURE.md:102-112.
spring:
  application:
    name: search-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    schemas: search
    default-schema: search
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: search-service-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        format_sql: false
        default_schema: search
  data:
    redis:
      timeout: 2000ms
      connect-timeout: 2000ms
  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8102

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
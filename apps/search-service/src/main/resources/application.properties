spring.application.name=search-service
server.port=8102
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${SEARCH_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=search}
spring.datasource.username=${SEARCH_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${SEARCH_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=search
spring.flyway.schemas=search
spring.flyway.default-schema=search
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS search;
spring.data.redis.host=${SEARCH_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${SEARCH_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${SEARCH_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${SEARCH_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
search-service.keycloak.base-url=${SEARCH_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
search-service.keycloak.issuer-uri=${SEARCH_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
search-service.keycloak.jwks-uri=${SEARCH_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
search-service.keycloak.admin-realm=${SEARCH_SERVICE_KEYCLOAK_ADMIN_REALM:master}
search-service.keycloak.admin-client-id=${SEARCH_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
search-service.keycloak.admin-client-secret=${SEARCH_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
search-service.keycloak.admin-username=${SEARCH_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
search-service.keycloak.admin-password=${SEARCH_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

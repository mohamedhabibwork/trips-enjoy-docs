# Spring Boot 4 baseline for identity-service.
# The actual property values live in `application.properties` (preserved for
# backwards compatibility with the existing contract); environment-specific
# overrides live in `application-dev.yml`, `application-stg.yml`,
# `application-prod.yml`. See /Users/habib/work/docs/uber/.env.example for the
# full <SVC>_* env-var surface and `docs/architecture/CONFIGURATION_ARCHITECTURE.md`
# for the precedence rules.
spring:
  application:
    name: identity-service
  profiles:
    # Default profile when SPRING_PROFILES_ACTIVE is unset.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    # Schema name per docs/architecture/DATABASE_ARCHITECTURE.md:102
    schemas: identity
    default-schema: identity
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8082

platform:
  observability:
    service: identity-service
    env: ${SPRING_PROFILES_ACTIVE:dev}
    region: ${PLATFORM_REGION:local}
    tenant: global
  api-docs:
    title: identity-service API
    version: 1.0.0
    description: Keycloak identity, sessions, claims
    contact-name: Identity Platform Team
    contact-email: identity@trips-enjoy.com
  audit:
    service: identity-service
  security:
    admin:
      base-path: /admin/v1
      min-role: identity.admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

# HikariCP — see docs/shared/AUTO_CONFIG.md §3 for the platform defaults.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: identity-service-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_schema: identity
        format_sql: false

  data:
    redis:
      timeout: 2000ms
      connect-timeout: 2000ms

  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true

identity:
  outbox:
    publish-interval-ms: ${IDENTITY_OUTBOX_PUBLISH_INTERVAL_MS:1000}

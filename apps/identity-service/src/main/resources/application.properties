spring.application.name=identity-service
server.port=8082
identity.public-url=${IDENTITY_PUBLIC_URL:http://localhost:8082}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
debug=true
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.datasource.url=${IDENTITY_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=identity}
spring.datasource.username=${IDENTITY_DB_USERNAME:postgres}
spring.datasource.password=${IDENTITY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=identity
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.datasource.hikari.connection-init-sql="CREATE SCHEMA IF NOT EXISTS identity;"
spring.data.redis.host=${IDENTITY_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${IDENTITY_REDIS_PORT:6379}
spring.data.redis.password=${IDENTITY_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${IDENTITY_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}
identity.keycloak.base-url=${IDENTITY_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
identity.keycloak.issuer-uri=${IDENTITY_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
identity.keycloak.jwks-uri=${IDENTITY_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
identity.keycloak.admin-username=${IDENTITY_KEYCLOAK_ADMIN_USERNAME:admin@inovoria.com}

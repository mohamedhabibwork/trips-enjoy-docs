identity.keycloak.admin-client-secret=${IDENTITY_KEYCLOAK_ADMIN_CLIENT_SECRET:Yztlv8RpyyAKOxzOMzDOtoS2YkKfkG5r}
identity.outbox.publish-interval-ms=${IDENTITY_OUTBOX_PUBLISH_INTERVAL_MS:1000}
identity.session.denylist-ttl-seconds=${IDENTITY_SESSION_DENYLIST_TTL_SECONDS:86400}

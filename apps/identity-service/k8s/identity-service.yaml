apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-service
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
    spec:
      serviceAccountName: identity-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: identity-service
          image: registry.trips-enjoy.com/identity-service:REPLACE_WITH_SHA
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - secretRef:
                name: identity-service-runtime
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: http }
          readinessProbe:
            httpGet: { path: /ready, port: http }
          startupProbe:
            httpGet: { path: /started, port: http }
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: identity-service }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-service
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
---
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-service-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: identity-service
      containers:
        - name: migrate
          image: registry.trips-enjoy.com/identity-service:REPLACE_WITH_SHA
          args: ["migrate", "--spring.main.web-application-type=none"]
          envFrom:
            - secretRef: { name: identity-service-runtime }

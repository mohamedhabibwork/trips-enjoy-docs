spring:
  flyway:
    enabled: true
    schemas: food_order
    default-schema: food_order
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: food_order

food-order:
  security:
    enabled: false
  outbox:
    poll-interval-ms: 60000
spring.application.name=food-order-service
server.port=8101
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${FOOD_ORDER_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=food_order}
spring.datasource.username=${FOOD_ORDER_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${FOOD_ORDER_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=food_order
spring.flyway.schemas=food_order
spring.flyway.default-schema=food_order
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS food_order;
spring.data.redis.host=${FOOD_ORDER_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${FOOD_ORDER_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${FOOD_ORDER_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${FOOD_ORDER_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
food-order-service.keycloak.base-url=${FOOD_ORDER_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
food-order-service.keycloak.issuer-uri=${FOOD_ORDER_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
food-order-service.keycloak.jwks-uri=${FOOD_ORDER_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
food-order-service.keycloak.admin-realm=${FOOD_ORDER_SERVICE_KEYCLOAK_ADMIN_REALM:master}
food-order-service.keycloak.admin-client-id=${FOOD_ORDER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
food-order-service.keycloak.admin-client-secret=${FOOD_ORDER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
food-order-service.keycloak.admin-username=${FOOD_ORDER_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
food-order-service.keycloak.admin-password=${FOOD_ORDER_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

spring:
  datasource:
    url: ${ADMIN_SERVICE_DB_URL}
    username: ${ADMIN_SERVICE_DB_USERNAME}
    password: ${ADMIN_SERVICE_DB_PASSWORD}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS admin;'
  data:
    redis:
      host: ${ADMIN_SERVICE_REDIS_HOST}
      port: ${ADMIN_SERVICE_REDIS_PORT}
      password: ${ADMIN_SERVICE_REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${ADMIN_SERVICE_KAFKA_BOOTSTRAP_SERVERS}

admin-service:
  keycloak:
    base-url: ${ADMIN_SERVICE_KEYCLOAK_BASE_URL}
    issuer-uri: ${ADMIN_SERVICE_KEYCLOAK_ISSUER_URI}
    jwks-uri: ${ADMIN_SERVICE_KEYCLOAK_JWKS_URI}
    admin-realm: ${ADMIN_SERVICE_KEYCLOAK_ADMIN_REALM}
    admin-client-id: ${ADMIN_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${ADMIN_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET}
    admin-username: ${ADMIN_SERVICE_KEYCLOAK_ADMIN_USERNAME}
    admin-password: ${ADMIN_SERVICE_KEYCLOAK_ADMIN_PASSWORD}

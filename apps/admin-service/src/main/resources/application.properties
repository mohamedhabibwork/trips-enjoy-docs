spring.application.name=admin-service
server.port=8094
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${ADMIN_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=admin}
spring.datasource.username=${ADMIN_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${ADMIN_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=admin
spring.flyway.schemas=admin
spring.flyway.default-schema=admin
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS admin;
spring.data.redis.host=${ADMIN_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${ADMIN_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${ADMIN_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${ADMIN_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
admin-service.keycloak.base-url=${ADMIN_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
admin-service.keycloak.issuer-uri=${ADMIN_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
admin-service.keycloak.jwks-uri=${ADMIN_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
admin-service.keycloak.admin-realm=${ADMIN_SERVICE_KEYCLOAK_ADMIN_REALM:master}
admin-service.keycloak.admin-client-id=${ADMIN_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
admin-service.keycloak.admin-client-secret=${ADMIN_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
admin-service.keycloak.admin-username=${ADMIN_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
admin-service.keycloak.admin-password=${ADMIN_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

[project]
name = "reporting-service"
version = "1.0.0"
description = "Analytics & Read Models Reporting Microservice"
requires-python = ">=3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "trips-enjoy platform team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiokafka>=0.12.0",
    "redis>=5.2.0",
    # JWT verification (TECH.md §6: authlib for Python).
    "authlib>=1.3.2",
    "pyjwt[crypto]>=2.9.0",
    # Migrations per docs/shared/PLATFORM_BASELINE.md §2.
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    # Cross-cutting platform library at packages/platform-python/.
    "platform-python @ file:///${PROJECT_ROOT:-../../packages}/platform-python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.13.0",  # py313 target-version requires ruff >= 0.13 for src layout upgrade; runtime contract is Python 3.14+ (uuid.uuid7)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # `assert` is fine in tests
    "B008",  # FastAPI `Depends()` patterns trigger false positives
    "S105",  # Test fixtures intentionally use literal "password"/"token" key names to verify the redactor; values are non-secret constants.
    "S608",  # Schema/table names are pulled from a closed catalog (_VIEWS / _READ_MODELS); identifiers are validated by `_safe_identifier()` before interpolation.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
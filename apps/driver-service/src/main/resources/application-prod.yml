spring:
  datasource:
    url: ${DRIVER_SERVICE_DB_URL}
    username: ${DRIVER_SERVICE_DB_USERNAME}
    password: ${DRIVER_SERVICE_DB_PASSWORD}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS driver;'
  data:
    redis:
      host: ${DRIVER_SERVICE_REDIS_HOST}
      port: ${DRIVER_SERVICE_REDIS_PORT}
      password: ${DRIVER_SERVICE_REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${DRIVER_SERVICE_KAFKA_BOOTSTRAP_SERVERS}

driver-service:
  keycloak:
    base-url: ${DRIVER_SERVICE_KEYCLOAK_BASE_URL}
    issuer-uri: ${DRIVER_SERVICE_KEYCLOAK_ISSUER_URI}
    jwks-uri: ${DRIVER_SERVICE_KEYCLOAK_JWKS_URI}
    admin-realm: ${DRIVER_SERVICE_KEYCLOAK_ADMIN_REALM}
    admin-client-id: ${DRIVER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${DRIVER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET}
    admin-username: ${DRIVER_SERVICE_KEYCLOAK_ADMIN_USERNAME}
    admin-password: ${DRIVER_SERVICE_KEYCLOAK_ADMIN_PASSWORD}

spring.application.name=driver-service
server.port=8091
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${DRIVER_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=driver}
spring.datasource.username=${DRIVER_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${DRIVER_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=driver
spring.flyway.schemas=driver
spring.flyway.default-schema=driver
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS driver;
spring.data.redis.host=${DRIVER_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${DRIVER_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${DRIVER_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${DRIVER_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
driver-service.keycloak.base-url=${DRIVER_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
driver-service.keycloak.issuer-uri=${DRIVER_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
driver-service.keycloak.jwks-uri=${DRIVER_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
driver-service.keycloak.admin-realm=${DRIVER_SERVICE_KEYCLOAK_ADMIN_REALM:master}
driver-service.keycloak.admin-client-id=${DRIVER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
driver-service.keycloak.admin-client-secret=${DRIVER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
driver-service.keycloak.admin-username=${DRIVER_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
driver-service.keycloak.admin-password=${DRIVER_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

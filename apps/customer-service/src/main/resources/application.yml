# Spring Boot 4 baseline for customer-service. See application-{dev,stg,prod}.yml
# for environment overrides and .env.example for the env-var surface.
#
# DB model: every service shares database `trips_enjoy` and owns one schema
# `customer` per docs/architecture/DATABASE_ARCHITECTURE.md:102-112.
spring:
  application:
    name: customer-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    schemas: customer
    default-schema: customer
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: customer-service-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        format_sql: false
        default_schema: customer
  data:
    redis:
      timeout: 2000ms
      connect-timeout: 2000ms
  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8090

platform:
  observability:
    service: customer-service
    env: ${SPRING_PROFILES_ACTIVE:dev}
    region: ${PLATFORM_REGION:local}
    tenant: global
  api-docs:
    title: customer-service API
    version: 1.0.0
    description: Customer profile, KYC, loyalty, addresses
    contact-name: Customer Platform Team
    contact-email: customer@trips-enjoy.com
  audit:
    service: customer-service
  security:
    admin:
      base-path: /admin/v1
      min-role: customer.admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

# Customer-service tuning knobs. Mirror the standards used by
# configuration-service / audit-service.
customer-service:
  outbox:
    publish-interval-ms: 1000
  inbox:
    purge-interval-ms: 3600000
  idempotency:
    ttl-seconds: 86400
    purge-interval-ms: 3600000
  partition:
    horizon-months: 12
    cron: "0 0 2 * * *"
  segment:
    frequent-rides: 20
    vip-ltv-minor: 1000000
    churned-idle-days: 90
    nightly-cron: "0 30 2 * * *"
  kafka:
    consumer:
      group-id: customer-service

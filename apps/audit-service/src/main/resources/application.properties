# Backwards-compat shim: properties previously kept here are now expressed in
# application.yml (single source of truth). See application-{dev,stg,prod}.yml
# for environment-specific overrides and `.env.example` for the env-var
# surface.
spring.application.name=audit-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs

spring:
  datasource:
    url: ${AUDIT_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=audit}
    username: ${AUDIT_SERVICE_DB_USERNAME:postgres}
    password: ${AUDIT_SERVICE_DB_PASSWORD:}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS audit;'
  data:
    redis:
      host: ${AUDIT_SERVICE_REDIS_HOST:0.0.0.0}
      port: ${AUDIT_SERVICE_REDIS_PORT:6379}
      password: ${AUDIT_SERVICE_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${AUDIT_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

audit-service:
  keycloak:
    base-url: ${AUDIT_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
    issuer-uri: ${AUDIT_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
    jwks-uri: ${AUDIT_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
    admin-realm: ${AUDIT_SERVICE_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${AUDIT_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
    admin-client-secret: ${AUDIT_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${AUDIT_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${AUDIT_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}
  # Dev profile: enable the V4 seed + AuditDevDataSeeder so a fresh
  # schema boots with a valid hash chain + 3 litigation holds + 3 read
  # log entries. The seeder also recomputes hash values in-place on
  # first boot. Production / staging must NOT set this flag.
  seed:
    enabled: ${AUDIT_SEED_ENABLED:true}
  # Dev profile: enable Keycloak seeder so a fresh Keycloak realm is
  # provisioned on first boot. Requires a Keycloak admin client id +
  # secret; without those the seeder logs a warning and exits.
  keycloak-seed:
    enabled: ${AUDIT_KEYCLOAK_SEED_ENABLED:false}
  seed-username: ${AUDIT_SEED_SUPER_ADMIN_USERNAME:}
  seed-password: ${AUDIT_SEED_SUPER_ADMIN_PASSWORD:}

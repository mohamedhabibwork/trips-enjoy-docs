# Spring Boot 4 baseline for pricing-service. See application-{dev,stg,prod}.yml
# for environment overrides and .env.example for the env-var surface.
#
# DB model: every service shares database `trips_enjoy` and owns one schema
# `pricing` per docs/architecture/DATABASE_ARCHITECTURE.md:102-112.
spring:
  application:
    name: pricing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    schemas: pricing
    default-schema: pricing
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: pricing-service-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        format_sql: false
        default_schema: pricing
  data:
    redis:
      timeout: 2000ms
      connect-timeout: 2000ms
  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8096

platform:
  observability:
    service: pricing-service
    env: ${SPRING_PROFILES_ACTIVE:dev}
    region: ${PLATFORM_REGION:local}
    tenant: global
  api-docs:
    title: pricing-service API
    version: 1.0.0
    description: pricing-service is the platform's quote engine — computes ride + food prices using the B0 base_fare + B1 rating-density + B2 loyalty + B3 geo-config + B4 surge pipeline. Owns rule_bindings, per-zone surge + rating-density caches, and loyalty_frequent_cache.
    contact-name: Pricing Platform Team
    contact-email: pricing@trips-enjoy.com
  audit:
    service: pricing-service
  security:
    admin:
      base-path: /admin/v1
      min-role: pricing.admin
  # Phase B (platform-DRY initiative): canonical outbox/inbox/idempotency
  # config. pricing-service persists into the canonical shape on top of
  # pricing.outbox_events (ADR-0028). The local OutboxPublisher still
  # wins via @ConditionalOnMissingBean.
  outbox:
    enabled: false
    interval-ms: 1000
    batch-size: 100
    max-attempts: 6
  inbox:
    enabled: false
    purge-cron: "0 0 3 * * *"
    retention-days: 7
  idempotency:
    enabled: false
    ttl-seconds: 86400
    purge-cron: "0 30 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
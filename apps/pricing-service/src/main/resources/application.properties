spring.application.name=pricing-service
server.port=8096
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${PRICING_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=pricing}
spring.datasource.username=${PRICING_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${PRICING_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=pricing
spring.flyway.schemas=pricing
spring.flyway.default-schema=pricing
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS pricing;
spring.data.redis.host=${PRICING_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${PRICING_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${PRICING_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${PRICING_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
pricing-service.keycloak.base-url=${PRICING_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
pricing-service.keycloak.issuer-uri=${PRICING_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
pricing-service.keycloak.jwks-uri=${PRICING_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
pricing-service.keycloak.admin-realm=${PRICING_SERVICE_KEYCLOAK_ADMIN_REALM:master}
pricing-service.keycloak.admin-client-id=${PRICING_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
pricing-service.keycloak.admin-client-secret=${PRICING_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
pricing-service.keycloak.admin-username=${PRICING_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
pricing-service.keycloak.admin-password=${PRICING_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

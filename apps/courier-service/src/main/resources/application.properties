spring.application.name=courier-service
server.port=8092
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${COURIER_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=courier}
spring.datasource.username=${COURIER_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${COURIER_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=courier
spring.flyway.schemas=courier
spring.flyway.default-schema=courier
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS courier;
spring.data.redis.host=${COURIER_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${COURIER_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${COURIER_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${COURIER_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
courier-service.keycloak.base-url=${COURIER_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
courier-service.keycloak.issuer-uri=${COURIER_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
courier-service.keycloak.jwks-uri=${COURIER_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
courier-service.keycloak.admin-realm=${COURIER_SERVICE_KEYCLOAK_ADMIN_REALM:master}
courier-service.keycloak.admin-client-id=${COURIER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
courier-service.keycloak.admin-client-secret=${COURIER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
courier-service.keycloak.admin-username=${COURIER_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
courier-service.keycloak.admin-password=${COURIER_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

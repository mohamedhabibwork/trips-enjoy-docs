spring:
  datasource:
    url: ${COURIER_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=courier}
    username: ${COURIER_SERVICE_DB_USERNAME:postgres}
    password: ${COURIER_SERVICE_DB_PASSWORD:}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS courier;'
  data:
    redis:
      host: ${COURIER_SERVICE_REDIS_HOST:0.0.0.0}
      port: ${COURIER_SERVICE_REDIS_PORT:6379}
      password: ${COURIER_SERVICE_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${COURIER_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

courier-service:
  keycloak:
    base-url: ${COURIER_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
    issuer-uri: ${COURIER_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
    jwks-uri: ${COURIER_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
    admin-realm: ${COURIER_SERVICE_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${COURIER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
    admin-client-secret: ${COURIER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${COURIER_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${COURIER_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

spring.application.name=trip-service
server.port=8100
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${TRIP_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=trip}
spring.datasource.username=${TRIP_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${TRIP_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=trip
spring.flyway.schemas=trip
spring.flyway.default-schema=trip
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS trip;
spring.data.redis.host=${TRIP_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${TRIP_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${TRIP_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${TRIP_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
trip-service.keycloak.base-url=${TRIP_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
trip-service.keycloak.issuer-uri=${TRIP_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
trip-service.keycloak.jwks-uri=${TRIP_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
trip-service.keycloak.admin-realm=${TRIP_SERVICE_KEYCLOAK_ADMIN_REALM:master}
trip-service.keycloak.admin-client-id=${TRIP_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
trip-service.keycloak.admin-client-secret=${TRIP_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
trip-service.keycloak.admin-username=${TRIP_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
trip-service.keycloak.admin-password=${TRIP_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

spring:
  datasource:
    url: ${PAYMENT_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=payment}
    username: ${PAYMENT_SERVICE_DB_USERNAME:postgres}
    password: ${PAYMENT_SERVICE_DB_PASSWORD:}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS payment;'
  data:
    redis:
      host: ${PAYMENT_SERVICE_REDIS_HOST:0.0.0.0}
      port: ${PAYMENT_SERVICE_REDIS_PORT:6379}
      password: ${PAYMENT_SERVICE_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${PAYMENT_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

payment-service:
  keycloak:
    base-url: ${PAYMENT_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
    issuer-uri: ${PAYMENT_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
    jwks-uri: ${PAYMENT_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
    admin-realm: ${PAYMENT_SERVICE_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${PAYMENT_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
    admin-client-secret: ${PAYMENT_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${PAYMENT_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${PAYMENT_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

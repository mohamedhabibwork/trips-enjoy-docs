spring.application.name=payment-service
server.port=8097
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${PAYMENT_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=payment}
spring.datasource.username=${PAYMENT_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${PAYMENT_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=payment
spring.flyway.schemas=payment
spring.flyway.default-schema=payment
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS payment;
spring.data.redis.host=${PAYMENT_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${PAYMENT_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${PAYMENT_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${PAYMENT_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
payment-service.keycloak.base-url=${PAYMENT_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
payment-service.keycloak.issuer-uri=${PAYMENT_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
payment-service.keycloak.jwks-uri=${PAYMENT_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
payment-service.keycloak.admin-realm=${PAYMENT_SERVICE_KEYCLOAK_ADMIN_REALM:master}
payment-service.keycloak.admin-client-id=${PAYMENT_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
payment-service.keycloak.admin-client-secret=${PAYMENT_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
payment-service.keycloak.admin-username=${PAYMENT_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
payment-service.keycloak.admin-password=${PAYMENT_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

# Alembic configuration for fraud-risk-service.
# Per docs/shared/PLATFORM_BASELINE.md §2: "Flyway 11 (Spring Boot services),
# golang-migrate (Go services), alembic (Python)".
#
# The actual DB URL is supplied at runtime via FRAUD_RISK_SERVICE_DB_SYNC_URL
# (or the SQLAlchemy `url` here, which is filled by migrations/env.py from
# the env var).
[alembic]
script_location = migrations
prepend_sys_path = .
# Empty here on purpose — env.py fills it from $FRAUD_RISK_SERVICE_DB_SYNC_URL
sqlalchemy.url =

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

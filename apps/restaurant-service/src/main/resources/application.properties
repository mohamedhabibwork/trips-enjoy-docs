spring.application.name=restaurant-service
server.port=8093
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${RESTAURANT_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=restaurant}
spring.datasource.username=${RESTAURANT_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${RESTAURANT_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=restaurant
spring.flyway.schemas=restaurant
spring.flyway.default-schema=restaurant
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS restaurant;
spring.data.redis.host=${RESTAURANT_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${RESTAURANT_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${RESTAURANT_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${RESTAURANT_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
restaurant-service.keycloak.base-url=${RESTAURANT_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
restaurant-service.keycloak.issuer-uri=${RESTAURANT_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
restaurant-service.keycloak.jwks-uri=${RESTAURANT_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
restaurant-service.keycloak.admin-realm=${RESTAURANT_SERVICE_KEYCLOAK_ADMIN_REALM:master}
restaurant-service.keycloak.admin-client-id=${RESTAURANT_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
restaurant-service.keycloak.admin-client-secret=${RESTAURANT_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
restaurant-service.keycloak.admin-username=${RESTAURANT_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
restaurant-service.keycloak.admin-password=${RESTAURANT_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

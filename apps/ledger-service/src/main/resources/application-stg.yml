spring:
  datasource:
    url: ${LEDGER_SERVICE_DB_URL}
    username: ${LEDGER_SERVICE_DB_USERNAME}
    password: ${LEDGER_SERVICE_DB_PASSWORD}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS ledger;'
  data:
    redis:
      host: ${LEDGER_SERVICE_REDIS_HOST}
      port: ${LEDGER_SERVICE_REDIS_PORT}
      password: ${LEDGER_SERVICE_REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${LEDGER_SERVICE_KAFKA_BOOTSTRAP_SERVERS}

ledger-service:
  keycloak:
    base-url: ${LEDGER_SERVICE_KEYCLOAK_BASE_URL}
    issuer-uri: ${LEDGER_SERVICE_KEYCLOAK_ISSUER_URI}
    jwks-uri: ${LEDGER_SERVICE_KEYCLOAK_JWKS_URI}
    admin-realm: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_REALM}
    admin-client-id: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET}
    admin-username: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_USERNAME}
    admin-password: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_PASSWORD}

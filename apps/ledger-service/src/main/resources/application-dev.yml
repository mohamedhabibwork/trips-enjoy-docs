spring:
  datasource:
    url: ${LEDGER_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=ledger}
    username: ${LEDGER_SERVICE_DB_USERNAME:postgres}
    password: ${LEDGER_SERVICE_DB_PASSWORD:}
    hikari:
      connection-init-sql: 'CREATE SCHEMA IF NOT EXISTS ledger;'
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  data:
    redis:
      host: ${LEDGER_SERVICE_REDIS_HOST:0.0.0.0}
      port: ${LEDGER_SERVICE_REDIS_PORT:6379}
      password: ${LEDGER_SERVICE_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${LEDGER_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

ledger-service:
  keycloak:
    base-url: ${LEDGER_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
    issuer-uri: ${LEDGER_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
    jwks-uri: ${LEDGER_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
    admin-realm: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
    admin-client-secret: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${LEDGER_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

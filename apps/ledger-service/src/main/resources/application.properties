spring.application.name=ledger-service
server.port=8087
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
spring.datasource.url=${LEDGER_SERVICE_DB_URL:jdbc:postgresql://0.0.0.0:5432/trips_enjoy?currentSchema=ledger}
spring.datasource.username=${LEDGER_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${LEDGER_SERVICE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=ledger
spring.flyway.schemas=ledger
spring.flyway.default-schema=ledger
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ledger;
spring.data.redis.host=${LEDGER_SERVICE_REDIS_HOST:0.0.0.0}
spring.data.redis.port=${LEDGER_SERVICE_REDIS_PORT:6379}
spring.data.redis.password=${LEDGER_SERVICE_REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${LEDGER_SERVICE_KAFKA_BOOTSTRAP_SERVERS:http://81.208.166.110:9092}

# Platform Keycloak — values resolve from <SVC>_KEYCLOAK_* env vars (placeholders
# shown; .env / Vault supplies the real ones).
ledger-service.keycloak.base-url=${LEDGER_SERVICE_KEYCLOAK_BASE_URL:http://0.0.0.0:8181}
ledger-service.keycloak.issuer-uri=${LEDGER_SERVICE_KEYCLOAK_ISSUER_URI:http://0.0.0.0:8181/realms/platform-services}
ledger-service.keycloak.jwks-uri=${LEDGER_SERVICE_KEYCLOAK_JWKS_URI:http://0.0.0.0:8181/realms/platform-services/protocol/openid-connect/certs}
ledger-service.keycloak.admin-realm=${LEDGER_SERVICE_KEYCLOAK_ADMIN_REALM:master}
ledger-service.keycloak.admin-client-id=${LEDGER_SERVICE_KEYCLOAK_ADMIN_CLIENT_ID:}
ledger-service.keycloak.admin-client-secret=${LEDGER_SERVICE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
ledger-service.keycloak.admin-username=${LEDGER_SERVICE_KEYCLOAK_ADMIN_USERNAME:}
ledger-service.keycloak.admin-password=${LEDGER_SERVICE_KEYCLOAK_ADMIN_PASSWORD:}

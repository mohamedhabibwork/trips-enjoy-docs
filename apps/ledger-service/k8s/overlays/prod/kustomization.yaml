# Production overlay — 6+ replicas, full 10-year retention, prod Vault.
#
# Apply with: kubectl apply -k apps/ledger-service/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ledger-service

bases:
  - ../../

images:
  - name: registry.trips-enjoy.com/ledger-service
    newName: registry.trips-enjoy.com/ledger-service
    # newTag is injected by the release pipeline from the commit SHA.

# Patch the Deployment for stricter production settings.
patches:
  - target:
      kind: Deployment
      name: ledger-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 6
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
  - target:
      kind: HorizontalPodAutoscaler
      name: ledger-service
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 6
      - op: replace
        path: /spec/maxReplicas
        value: 18

# Patch the ConfigMap to prod profile + full retention.
configMapGenerator:
  - name: ledger-service-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - LEDGER_RETENTION_YEARS=10
      - LEDGER_PARTITION_PRECREATE_MONTHS=12
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_TRIPS_ENJOY=INFO

# Patch the PDB to be stricter in prod (must keep at least 75% available).
patches:
  - target:
      kind: PodDisruptionBudget
      name: ledger-service
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 75%

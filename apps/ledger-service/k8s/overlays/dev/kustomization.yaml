# Dev overlay — local single-replica deployment with reduced retention.
#
# Apply with: kubectl apply -k apps/ledger-service/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ledger-service-dev

bases:
  - ../../

# Local-dev image — usually a `:dev` tag built from the current branch.
images:
  - name: registry.trips-enjoy.com/ledger-service
    newName: registry.trips-enjoy.com/ledger-service
    newTag: "dev"

# Patch the Deployment to a single replica (devs run on a laptop).
patches:
  - target:
      kind: Deployment
      name: ledger-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: HorizontalPodAutoscaler
      name: ledger-service
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

# Patch the ConfigMap to dev profile + reduced retention.
configMapGenerator:
  - name: ledger-service-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - LEDGER_RETENTION_YEARS=2
      - LEDGER_PARTITION_PRECREATE_MONTHS=3
      - LOGGING_LEVEL_ROOT=DEBUG
      - LOGGING_LEVEL_COM_TRIPS_ENJOY=DEBUG

# Patch CronJobs to suspend (the in-process scheduler runs them in dev).
patches:
  - target:
      kind: CronJob
      name: ledger-service-retention
    patch: |
      - op: replace
        path: /spec/suspend
        value: true
  - target:
      kind: CronJob
      name: ledger-service-reconciliation
    patch: |
      - op: replace
        path: /spec/suspend
        value: true
